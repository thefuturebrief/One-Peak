<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>One Peak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Outfit:wght@300;400;500;600;700;800&family=Caveat:wght@500;700&display=swap">
<style>
/* Juego a pantalla completa: mundo en píxel, interfaz en vidrio oscuro cálido con oro. Un solo tema, a propósito. */
:root{--ink:#140c08;--glass:rgba(22,14,10,.66);--glass2:rgba(30,20,14,.82);--edge:rgba(255,214,150,.2);--txt:#fff6e8;--dim:#d9c6a8;--mute:#9c8a70;
  --gold:#f5b73a;--gold2:#ffd98a;--red:#e2492f;--f:"Outfit",system-ui,sans-serif;--fd:"Rammetto One","Outfit",sans-serif;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--txt);font-family:var(--f);overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas.px{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges}
#bg{left:50%;top:50%;animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-50%,-50%) scale(1.02)}to{transform:translate(-53%,-50%) scale(1.08)}}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,8,5,.9) 0%,rgba(14,8,5,.62) 34%,rgba(14,8,5,.1) 62%,rgba(14,8,5,0) 100%),linear-gradient(0deg,rgba(14,8,5,.7),transparent 30%)}
#app.deep .shade{background:linear-gradient(90deg,rgba(14,8,5,.92) 0%,rgba(14,8,5,.78) 46%,rgba(14,8,5,.45) 100%)}
@media (max-width:700px){.shade{background:linear-gradient(0deg,rgba(14,8,5,.88),rgba(14,8,5,.4) 70%,rgba(14,8,5,.25))}}
#app.playing .shade,#app.playing #bg{display:none}
.screen{position:absolute;inset:0;padding:max(28px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;animation:fade .45s ease both;overflow-y:auto}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.col{width:min(620px,100%);margin-left:clamp(0px,6vw,96px);display:flex;flex-direction:column;gap:18px;margin-block:auto}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.logo{font-family:var(--fd);font-size:clamp(54px,10vw,112px);line-height:.92;margin:0;background:linear-gradient(180deg,#fff2c4 0%,#ffcf5c 45%,#f08a1e 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 #3a1608) drop-shadow(0 0 1px #3a1608) drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.logo span{display:block}.logo span+span{margin-left:.55em}
nav.menu{display:flex;flex-direction:column;gap:2px;margin-top:22px}
.mi{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;font-size:clamp(22px,2.6vw,30px);font-weight:700;padding:6px 0;transition:color .15s,transform .15s;width:max-content}
.mi svg{width:24px;height:24px;opacity:0;transform:rotate(-90deg) scale(.6);transition:all .25s}
.mi:hover,.mi:focus-visible{color:var(--gold2);transform:translateX(8px)}
.mi:hover svg,.mi:focus-visible svg{opacity:1;transform:none}
.mi:disabled{color:var(--mute);cursor:default;transform:none}
.ver{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));font-size:13px;color:var(--mute)}
.kick{font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
h1.t,h2.t{margin:0;font-weight:800;line-height:1.08;text-wrap:balance}
h1.t{font-size:clamp(34px,5vw,54px)}h2.t{font-size:clamp(26px,3.6vw,38px)}
.lead{margin:0;font-size:19px;line-height:1.5;color:var(--dim);max-width:52ch}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{all:unset;cursor:pointer;font-weight:700;font-size:17px;padding:13px 26px;border-radius:12px;background:linear-gradient(180deg,#ffcf5c,#f09a28);color:#2a1206;box-shadow:0 4px 0 #9a5410,0 10px 24px rgba(240,154,40,.25);transition:transform .1s}
.btn:hover{transform:translateY(-2px)}.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.ghost{background:transparent;color:var(--txt);border:1.5px solid var(--edge);box-shadow:none}
.create{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px;align-items:center;width:min(1060px,100%);margin:auto}
@media (max-width:820px){.create{grid-template-columns:1fr}}
.stagebox{position:relative;aspect-ratio:1;max-width:380px;width:100%;margin:auto}
.stagebox::before{content:"";position:absolute;left:12%;right:12%;bottom:8%;height:16%;border-radius:50%;background:radial-gradient(closest-side,rgba(245,183,58,.35),transparent)}
.stagebox canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.panel{padding:26px 28px;display:flex;flex-direction:column;gap:20px}
label.f{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
input.name{all:unset;font:600 22px var(--f);color:var(--txt);border-bottom:2px solid var(--edge);padding:6px 2px;-webkit-user-select:text;user-select:text}
input.name:focus{border-color:var(--gold)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{all:unset;cursor:pointer;font-size:16px;font-weight:600;padding:9px 16px;border-radius:999px;border:1.5px solid var(--edge);color:var(--dim)}
.seg button.on{background:var(--gold);border-color:var(--gold);color:#2a1206}
.seg button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.prog{height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red))}
.opts{display:flex;flex-direction:column;gap:8px}
@media (min-width:760px){.opts.many{display:grid;grid-template-columns:1fr 1fr}}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:center;padding:12px 18px;border-radius:14px;background:var(--glass);border:1px solid var(--edge);font-size:18px;font-weight:500;line-height:1.35;transition:all .15s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.opt kbd{font:700 14px var(--f);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;border:1.5px solid var(--edge);color:var(--dim)}
.opt:hover,.opt:focus-visible{border-color:var(--gold);background:var(--glass2);transform:translateX(6px)}
.opt:hover kbd,.opt:focus-visible kbd{background:var(--gold);border-color:var(--gold);color:#2a1206}
.event{font-size:clamp(22px,3vw,30px);font-weight:300;line-height:1.4;margin:0;max-width:30ch}
.credits{font-size:14px;line-height:1.6;color:var(--dim);max-height:46vh;overflow:auto}
.credits b{color:var(--txt)}
.tog{display:flex;justify-content:space-between;align-items:center;font-size:18px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.sw{all:unset;cursor:pointer;width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.18);position:relative}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.sw[aria-pressed="true"]{background:var(--gold)}.sw[aria-pressed="true"]::after{left:23px}

/* ===== juego ===== */
#hud{position:absolute;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
.clock{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:max(14px,env(safe-area-inset-top,0px));padding:8px 14px;display:flex;flex-direction:column;line-height:1.1}
.clock b{font-size:17px;font-weight:800}.clock span{font-size:13px;color:var(--gold2);font-weight:600}
.purse{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:max(14px,env(safe-area-inset-top,0px));padding:8px 14px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.purse i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6cc,#f0c450 45%,#b07a1e 80%);display:block}
.place{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);padding:6px 14px;transition:opacity .6s}
.hbtns{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.hb{all:unset;cursor:pointer;background:var(--glass);border:1px solid var(--edge);border-radius:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:relative;display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;font-size:15px}
.hb kbd{font:700 12px var(--f);padding:1px 6px;border-radius:5px;border:1.5px solid var(--edge);color:var(--dim)}
.hb:hover{border-color:var(--gold)}
.hb.new::after{content:"";position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--ink)}
.hb:focus-visible{outline:2px solid #fff;outline-offset:2px}
.prompt{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:9px;background:rgba(255,246,232,.95);color:#2a1206;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none}
.prompt kbd{font:800 12px var(--f);width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:#2a1206;color:#fff6e8}
.bubble{position:absolute;transform:translate(-50%,-100%);max-width:220px;padding:6px 10px;border-radius:10px;background:rgba(255,250,240,.96);color:#2a1206;font-size:13px;font-weight:600;line-height:1.3;text-align:center;pointer-events:none;animation:pop .2s ease both;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:rgba(255,250,240,.96);border-bottom:0}
@keyframes pop{from{opacity:0;transform:translate(-50%,-85%)}to{opacity:1;transform:translate(-50%,-100%)}}
.dlg{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(760px,calc(100% - 24px));padding:16px 20px 16px 16px;display:grid;grid-template-columns:76px 1fr;gap:16px;align-items:start}
.dlg .face{width:76px;height:76px;border-radius:12px;background:radial-gradient(circle at 50% 30%,#4a6a9a,#22344e);overflow:hidden;position:relative}
.dlg .face canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.franjas{position:absolute;inset:0;pointer-events:none}.franjas::before,.franjas::after{content:'';position:absolute;left:0;right:0;height:0;background:#050403;transition:height .6s ease}.franjas::before{top:0}.franjas::after{bottom:0}body.cine .franjas::before,body.cine .franjas::after{height:10vh}body.cine #hud .hbtns,body.cine #hud .clock,body.cine .purse,body.cine #pad{opacity:0;transition:opacity .4s}.destello{position:absolute;inset:0;pointer-events:none}
.dlg.pedir{grid-template-columns:1fr}.dlg.pedir label{display:grid;gap:6px;margin:10px 0 4px}.dlg.pedir .err{display:block;min-height:1.2em;color:#ffb48a}
.dlg b.nm{font-size:15px;font-weight:800;color:var(--gold2);letter-spacing:.04em}
.dlg p{margin:4px 0 0;font-size:18px;line-height:1.45}
.dlg .ch{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.dlg .ch button{all:unset;cursor:pointer;padding:8px 12px;border-radius:10px;border:1px solid var(--edge);font-size:16px;font-weight:600}
.dlg .ch button:hover,.dlg .ch button:focus-visible{border-color:var(--gold);color:var(--gold2)}
.dlg .more{position:absolute;right:16px;bottom:10px;font-size:12px;color:var(--mute)}
.diary{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,6,4,.55);padding:16px}
.diary .book{width:min(860px,100%);max-height:min(620px,100%);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.diary .tabs{display:flex;flex-wrap:wrap;gap:4px;padding:14px 16px 0;border-bottom:1px solid var(--edge)}
.diary .tabs button{all:unset;cursor:pointer;padding:9px 14px;font-weight:700;font-size:15px;color:var(--dim);border-bottom:3px solid transparent}
.diary .tabs button.on{color:var(--gold2);border-color:var(--gold)}
.diary .tabs button:focus-visible{outline:2px solid #fff}
.diary .tabs .x{margin-left:auto}
.diary .page{overflow:auto;padding:18px 22px 22px;display:flex;flex-direction:column;gap:12px}
.entry{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.07)}
.entry b{font-size:16px}.entry span{color:var(--dim);font-size:15px;line-height:1.5}
.empty{color:var(--mute);font-style:italic}
.axes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 24px}
.ax{display:grid;grid-template-columns:90px 1fr 90px;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.ax span:last-child{text-align:right}.ax .on{color:var(--txt);font-weight:600}
.ax .tr{height:5px;border-radius:3px;background:rgba(255,255,255,.12);position:relative}
.ax .tr i{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--gold);transform:translate(-50%,-50%)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:4px 20px}
.stats div{display:flex;justify-content:space-between;font-size:15px;color:var(--dim);border-bottom:1px solid rgba(255,255,255,.07)}
.stats b{color:var(--txt)}
#fadeov{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
.pad{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.pad button,.act{all:unset;border-radius:14px;background:var(--glass);border:1px solid var(--edge);display:grid;place-items:center;font-size:20px;color:var(--dim);touch-action:none}
.run{all:unset;position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:158px;padding:8px 14px;border-radius:12px;background:var(--glass);border:1px solid var(--edge);font-weight:700;font-size:14px;color:var(--dim)}
.run[aria-pressed="true"]{background:var(--gold);color:#2a1206;border-color:var(--gold)}
.act{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:84px;width:64px;height:64px;border-radius:50%;font-weight:800}
@media (pointer:coarse){.hb kbd,.dlg .more{display:none}}
#hud.talking #pad{display:none}

/* creación de personaje */
.cc{max-height:min(86vh,820px);display:flex;flex-direction:column;gap:14px}
.cc-scroll{overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:6px;min-height:0}
.cc-names{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:520px){.cc-names{grid-template-columns:1fr}}
.cc-row{display:grid;grid-template-columns:76px 1fr;gap:6px 12px;align-items:center}
.cc-row .lbl{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.cc-row .sws{grid-column:2}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.swt{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
.swt.on{outline:2px solid #fff;outline-offset:2px}
.swt:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.pk{display:flex;align-items:center;gap:10px}
.pk b{min-width:118px;text-align:center;font-size:16px}
.ar{all:unset;cursor:pointer;width:30px;height:30px;border-radius:9px;border:1.5px solid var(--edge);display:grid;place-items:center;font-size:18px;color:var(--dim)}
.ar:hover,.ar:focus-visible{border-color:var(--gold);color:var(--gold2)}
.stagebox .pv-dirs{position:absolute;left:0;right:0;bottom:-8px;display:flex;justify-content:center}
.btn.sm{font-size:14px;padding:8px 16px}
.cc-tabs{display:flex;gap:4px;border-bottom:1px solid var(--edge)}
.cc-tabs button{all:unset;cursor:pointer;padding:8px 14px;font-weight:700;font-size:15px;color:var(--dim);border-bottom:3px solid transparent}
.cc-tabs button[aria-selected="true"]{color:var(--gold2);border-color:var(--gold)}
.cc-tabs button:focus-visible{outline:2px solid #fff}
@media (max-width:820px){.stagebox{max-width:220px}}
/* introducción y final en tiza */
.tiza{position:absolute;inset:0;background:#161a18;display:grid;place-items:center;z-index:5;cursor:pointer}
.tiza canvas{width:min(100vw,124vh);height:auto;max-height:70vh;margin-bottom:12vh;image-rendering:auto}
.tiza p{position:absolute;left:50%;bottom:max(5vh,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(820px,calc(100% - 32px));text-align:center;margin:0;font:600 clamp(24px,3.4vw,38px)/1.25 "Caveat",var(--f);color:#f3efe4;opacity:0;transition:opacity .9s}
.tiza p.on{opacity:1}
.tiza .skip{all:unset;cursor:pointer;position:absolute;right:max(20px,env(safe-area-inset-right,0px));top:max(18px,env(safe-area-inset-top,0px));color:#bdb6a6;font-size:14px;font-weight:600}
.tiza .fin{position:absolute;inset:auto 0 12vh 0;display:flex;flex-direction:column;align-items:center;gap:12px;color:#f3efe4}
.tiza .fin b{font:700 clamp(34px,5vw,56px) "Caveat",var(--f)}
.tiza .fin span{color:#bdb6a6}.tiza .fin small{color:#8f897c;font-size:14px}
/* pelea */
.fight{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(760px,calc(100% - 24px));padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.fight .bars{display:grid;grid-template-columns:1fr 1fr;gap:18px;font-size:13px}
.fight .bars b{display:block;margin-bottom:4px;color:var(--gold2);letter-spacing:.04em}
.bar{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.bar s{display:block;height:100%;background:linear-gradient(90deg,#e2492f,#f08a3a);transition:width .5s}
.bar.me s{background:linear-gradient(90deg,#f5b73a,#ffd98a)}
.fight .nar{margin:0;font-size:18px;line-height:1.45}
.fight .ch{display:flex;flex-direction:column;gap:6px}
.fight .ch button{all:unset;cursor:pointer;display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;border:1px solid var(--edge);font-size:16px;font-weight:600}
.fight .ch button:hover,.fight .ch button:focus-visible{border-color:var(--gold);color:var(--gold2)}
.fight kbd{font:700 12px var(--f);width:22px;height:22px;border-radius:6px;display:grid;place-items:center;border:1.5px solid var(--edge);color:var(--dim)}
.risk{font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px}
.risk.ok{background:rgba(120,200,120,.18);color:#bfe8b0}.risk.mid{background:rgba(245,183,58,.18);color:var(--gold2)}.risk.hard{background:rgba(226,73,47,.2);color:#ffb3a3}
.hitflash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(closest-side,transparent 55%,rgba(226,73,47,.45));animation:fade .38s ease reverse both}
.dlg .ch.wait{visibility:hidden}
.pausa{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));padding:22px 24px;display:grid;gap:16px}
.pausa dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0;font-size:14px}.pausa dt{font-weight:800;color:var(--gold)}.pausa dd{margin:0;color:var(--dim)}
.pausa .pb{display:flex;gap:10px;flex-wrap:wrap}.pausa small{color:var(--dim);font-size:12px}
.tip{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:18px;padding:10px 16px;font-size:13px;white-space:nowrap;transition:opacity .8s}.tip.out{opacity:0}
.tip span{display:flex;align-items:center;gap:7px;color:var(--dim)}.tip kbd{font:800 11px var(--f);padding:2px 6px;border-radius:5px;border:1.5px solid var(--edge);color:#fff6e8}
.hud.talking .tip,#hud.talking .tip{display:none}
#vig{position:fixed;inset:0;pointer-events:none;display:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(8,10,20,.42) 100%)}.playing #vig{display:block}
