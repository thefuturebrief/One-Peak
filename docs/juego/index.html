<title>One Peak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Outfit:wght@300;400;500;600;700;800&display=swap">
<style>
/* Juego a pantalla completa: mundo en píxel, interfaz en vidrio oscuro cálido con oro. Un solo tema, a propósito. */
:root{--ink:#140c08;--glass:rgba(22,14,10,.66);--glass2:rgba(30,20,14,.82);--edge:rgba(255,214,150,.2);--txt:#fff6e8;--dim:#d9c6a8;--mute:#9c8a70;
  --gold:#f5b73a;--gold2:#ffd98a;--red:#e2492f;--f:"Outfit",system-ui,sans-serif;--fd:"Rammetto One","Outfit",sans-serif;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--txt);font-family:var(--f);overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas.px{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges}
#bg{left:50%;top:50%;animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-50%,-50%) scale(1.02)}to{transform:translate(-53%,-50%) scale(1.08)}}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,8,5,.9) 0%,rgba(14,8,5,.62) 34%,rgba(14,8,5,.1) 62%,rgba(14,8,5,0) 100%),linear-gradient(0deg,rgba(14,8,5,.7),transparent 30%)}
#app.deep .shade{background:linear-gradient(90deg,rgba(14,8,5,.92) 0%,rgba(14,8,5,.78) 46%,rgba(14,8,5,.45) 100%)}
@media (max-width:700px){.shade{background:linear-gradient(0deg,rgba(14,8,5,.88),rgba(14,8,5,.4) 70%,rgba(14,8,5,.25))}}
#app.playing .shade,#app.playing #bg{display:none}
.screen{position:absolute;inset:0;padding:max(28px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;animation:fade .45s ease both;overflow-y:auto}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.col{width:min(620px,100%);margin-left:clamp(0px,6vw,96px);display:flex;flex-direction:column;gap:18px;margin-block:auto}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.logo{font-family:var(--fd);font-size:clamp(54px,10vw,112px);line-height:.92;margin:0;background:linear-gradient(180deg,#fff2c4 0%,#ffcf5c 45%,#f08a1e 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 #3a1608) drop-shadow(0 0 1px #3a1608) drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.logo span{display:block}.logo span+span{margin-left:.55em}
nav.menu{display:flex;flex-direction:column;gap:2px;margin-top:22px}
.mi{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;font-size:clamp(22px,2.6vw,30px);font-weight:700;padding:6px 0;transition:color .15s,transform .15s;width:max-content}
.mi svg{width:24px;height:24px;opacity:0;transform:rotate(-90deg) scale(.6);transition:all .25s}
.mi:hover,.mi:focus-visible{color:var(--gold2);transform:translateX(8px)}
.mi:hover svg,.mi:focus-visible svg{opacity:1;transform:none}
.mi:disabled{color:var(--mute);cursor:default;transform:none}
.ver{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));font-size:13px;color:var(--mute)}
.kick{font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
h1.t,h2.t{margin:0;font-weight:800;line-height:1.08;text-wrap:balance}
h1.t{font-size:clamp(34px,5vw,54px)}h2.t{font-size:clamp(26px,3.6vw,38px)}
.lead{margin:0;font-size:19px;line-height:1.5;color:var(--dim);max-width:52ch}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{all:unset;cursor:pointer;font-weight:700;font-size:17px;padding:13px 26px;border-radius:12px;background:linear-gradient(180deg,#ffcf5c,#f09a28);color:#2a1206;box-shadow:0 4px 0 #9a5410,0 10px 24px rgba(240,154,40,.25);transition:transform .1s}
.btn:hover{transform:translateY(-2px)}.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.ghost{background:transparent;color:var(--txt);border:1.5px solid var(--edge);box-shadow:none}
.create{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px;align-items:center;width:min(1060px,100%);margin:auto}
@media (max-width:820px){.create{grid-template-columns:1fr}}
.stagebox{position:relative;aspect-ratio:1;max-width:380px;width:100%;margin:auto}
.stagebox::before{content:"";position:absolute;left:12%;right:12%;bottom:8%;height:16%;border-radius:50%;background:radial-gradient(closest-side,rgba(245,183,58,.35),transparent)}
.stagebox canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.panel{padding:26px 28px;display:flex;flex-direction:column;gap:20px}
label.f{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
input.name{all:unset;font:600 22px var(--f);color:var(--txt);border-bottom:2px solid var(--edge);padding:6px 2px;-webkit-user-select:text;user-select:text}
input.name:focus{border-color:var(--gold)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{all:unset;cursor:pointer;font-size:16px;font-weight:600;padding:9px 16px;border-radius:999px;border:1.5px solid var(--edge);color:var(--dim)}
.seg button.on{background:var(--gold);border-color:var(--gold);color:#2a1206}
.seg button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.prog{height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red))}
.opts{display:flex;flex-direction:column;gap:8px}
@media (min-width:760px){.opts.many{display:grid;grid-template-columns:1fr 1fr}}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:center;padding:12px 18px;border-radius:14px;background:var(--glass);border:1px solid var(--edge);font-size:18px;font-weight:500;line-height:1.35;transition:all .15s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.opt kbd{font:700 14px var(--f);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;border:1.5px solid var(--edge);color:var(--dim)}
.opt:hover,.opt:focus-visible{border-color:var(--gold);background:var(--glass2);transform:translateX(6px)}
.opt:hover kbd,.opt:focus-visible kbd{background:var(--gold);border-color:var(--gold);color:#2a1206}
.event{font-size:clamp(22px,3vw,30px);font-weight:300;line-height:1.4;margin:0;max-width:30ch}
.credits{font-size:14px;line-height:1.6;color:var(--dim);max-height:46vh;overflow:auto}
.credits b{color:var(--txt)}
.tog{display:flex;justify-content:space-between;align-items:center;font-size:18px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.sw{all:unset;cursor:pointer;width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.18);position:relative}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.sw[aria-pressed="true"]{background:var(--gold)}.sw[aria-pressed="true"]::after{left:23px}

/* ===== juego ===== */
#hud{position:absolute;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
.clock{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:max(14px,env(safe-area-inset-top,0px));padding:8px 14px;display:flex;flex-direction:column;line-height:1.1}
.clock b{font-size:17px;font-weight:800}.clock span{font-size:13px;color:var(--gold2);font-weight:600}
.purse{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:max(14px,env(safe-area-inset-top,0px));padding:8px 14px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.purse i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6cc,#f0c450 45%,#b07a1e 80%);display:block}
.place{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);padding:6px 14px;transition:opacity .6s}
.hbtns{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.hb{all:unset;cursor:pointer;background:var(--glass);border:1px solid var(--edge);border-radius:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:relative;display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;font-size:15px}
.hb kbd{font:700 12px var(--f);padding:1px 6px;border-radius:5px;border:1.5px solid var(--edge);color:var(--dim)}
.hb:hover{border-color:var(--gold)}
.hb.new::after{content:"";position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--ink)}
.hb:focus-visible{outline:2px solid #fff;outline-offset:2px}
.prompt{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:9px;background:rgba(255,246,232,.95);color:#2a1206;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none}
.prompt kbd{font:800 12px var(--f);width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:#2a1206;color:#fff6e8}
.bubble{position:absolute;transform:translate(-50%,-100%);max-width:220px;padding:6px 10px;border-radius:10px;background:rgba(255,250,240,.96);color:#2a1206;font-size:13px;font-weight:600;line-height:1.3;text-align:center;pointer-events:none;animation:pop .2s ease both;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:rgba(255,250,240,.96);border-bottom:0}
@keyframes pop{from{opacity:0;transform:translate(-50%,-85%)}to{opacity:1;transform:translate(-50%,-100%)}}
.dlg{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(760px,calc(100% - 24px));padding:16px 20px 16px 16px;display:grid;grid-template-columns:76px 1fr;gap:16px;align-items:start}
.dlg .face{width:76px;height:76px;border-radius:12px;background:radial-gradient(circle at 50% 30%,#4a6a9a,#22344e);overflow:hidden;position:relative}
.dlg .face canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.dlg b.nm{font-size:15px;font-weight:800;color:var(--gold2);letter-spacing:.04em}
.dlg p{margin:4px 0 0;font-size:18px;line-height:1.45}
.dlg .ch{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.dlg .ch button{all:unset;cursor:pointer;padding:8px 12px;border-radius:10px;border:1px solid var(--edge);font-size:16px;font-weight:600}
.dlg .ch button:hover,.dlg .ch button:focus-visible{border-color:var(--gold);color:var(--gold2)}
.dlg .more{position:absolute;right:16px;bottom:10px;font-size:12px;color:var(--mute)}
.diary{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,6,4,.55);padding:16px}
.diary .book{width:min(860px,100%);max-height:min(620px,100%);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.diary .tabs{display:flex;flex-wrap:wrap;gap:4px;padding:14px 16px 0;border-bottom:1px solid var(--edge)}
.diary .tabs button{all:unset;cursor:pointer;padding:9px 14px;font-weight:700;font-size:15px;color:var(--dim);border-bottom:3px solid transparent}
.diary .tabs button.on{color:var(--gold2);border-color:var(--gold)}
.diary .tabs button:focus-visible{outline:2px solid #fff}
.diary .tabs .x{margin-left:auto}
.diary .page{overflow:auto;padding:18px 22px 22px;display:flex;flex-direction:column;gap:12px}
.entry{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.07)}
.entry b{font-size:16px}.entry span{color:var(--dim);font-size:15px;line-height:1.5}
.empty{color:var(--mute);font-style:italic}
.axes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 24px}
.ax{display:grid;grid-template-columns:90px 1fr 90px;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.ax span:last-child{text-align:right}.ax .on{color:var(--txt);font-weight:600}
.ax .tr{height:5px;border-radius:3px;background:rgba(255,255,255,.12);position:relative}
.ax .tr i{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--gold);transform:translate(-50%,-50%)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:4px 20px}
.stats div{display:flex;justify-content:space-between;font-size:15px;color:var(--dim);border-bottom:1px solid rgba(255,255,255,.07)}
.stats b{color:var(--txt)}
#fadeov{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
.pad{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.pad button,.act{all:unset;border-radius:14px;background:var(--glass);border:1px solid var(--edge);display:grid;place-items:center;font-size:20px;color:var(--dim);touch-action:none}
.act{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:84px;width:64px;height:64px;border-radius:50%;font-weight:800}
@media (pointer:coarse){.hb kbd,.dlg .more{display:none}}
#hud.talking #pad{display:none}
@media (prefers-reduced-motion:reduce){#bg,.screen,.bubble{animation:none}.mi,.opt,.btn{transition:none}}
</style>

<div id="app">
  <canvas id="bg" class="px" width="640" height="360" aria-hidden="true"></canvas>
  <canvas id="game" class="px" hidden aria-label="Kalé"></canvas>
  <div class="shade"></div>
  <div id="root"></div>
  <div id="hud" hidden>
    <div class="clock glass"><b id="day">Día 1</b><span id="hour">08:00</span></div>
    <div class="place glass" id="placeName">Kalé</div>
    <div class="purse glass"><i></i><span>300</span></div>
    <div class="hbtns"><button class="hb glass" id="openDiary" type="button">Diario <kbd>J</kbd></button></div>
    <div id="overlays"></div>
    <div id="pad" hidden><div class="pad"><span></span><button data-d="up" aria-label="Arriba">▲</button><span></span><button data-d="left" aria-label="Izquierda">◀</button><span></span><button data-d="right" aria-label="Derecha">▶</button><span></span><button data-d="down" aria-label="Abajo">▼</button><span></span></div><button class="act" id="actBtn" aria-label="Interactuar">E</button></div>
  </div>
  <div id="fadeov"></div>
</div>

<script>

// =====================================================================
// MOTOR DE PIXEL ART (mismo de la biblia, escala nueva)
// =====================================================================
const WW=640,WH=360;
const C={out:0x2a1c26,
  g1:0x2c5a3c,g2:0x3e7c40,g3:0x5aa04a,g4:0x8ac85a,g5:0xc6e47e,d1:0x5e3a2a,d2:0x8e6040,d3:0xbc8e5c,d4:0xdcb882,
  s1:0xa8845a,s2:0xd4b07a,s3:0xead09a,s4:0xfaecc4,w0:0x13295a,w1:0x1d4686,w2:0x2a64a8,w3:0x3d86c6,w4:0x74b6e0,w5:0xcdeef6,wf:0xf4ffff,
  k1:0x3a2018,k2:0x6a3a24,k3:0x9a5c34,k4:0xc68a52,k5:0xe6b67e,p1:0x9a8ca0,p2:0xc9c0c8,p3:0xece3da,p4:0xfff8ee,
  r1:0x5a1e26,r2:0x8c2f2e,r3:0xc0503c,r4:0xe27e58,r5:0xf4b07e,t1:0x1c3c48,t2:0x2c6470,t3:0x489896,t4:0x86cabe,
  n1:0x383648,n2:0x5c586e,n3:0x8a8698,n4:0xbcb6c6,b1:0x6a4618,b2:0xb0842e,b3:0xe6c25e,b4:0xfff0b0,
  v1:0x2a1e34,v2:0x3e2e4e,v3:0x56426c,v4:0x725a8a,pink:0xf08aa8,red:0xc8402e,cream:0xefe4cc,cream2:0xddcca8,white:0xfff8ee};
function hash(x,y,s=0){let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,982451653))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
class PB{
  constructor(w,h){this.w=w;this.h=h;this.d=new Int32Array(w*h).fill(-1)}
  set(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h||c==null)return;this.d[y*this.w+x]=c}
  get(x,y){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return -1;return this.d[y*this.w+x]}
  rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,c)}
  ell(cx,cy,rx,ry,c,cond){for(let y=Math.floor(cy-ry-1);y<=cy+ry+1;y++)for(let x=Math.floor(cx-rx-1);x<=cx+rx+1;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1&&(!cond||cond(x,y)))this.set(x,y,c)}}
  poly(pts,c,cond){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const[x,y]of pts){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
    for(let y=Math.floor(y0);y<=y1;y++)for(let x=Math.floor(x0);x<=x1;x++){const px=x+.5,py=y+.5;let ins=false;
      for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)ins=!ins}
      if(ins&&(!cond||cond(x,y)))this.set(x,y,c)}}
  line(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
    for(;;){this.set(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
  thick(x0,y0,x1,y1,w,c){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))*2+1;for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;this.rect(Math.round(x-w/2),Math.round(y-w/2),w,w,c)}}
  recolor(from,to,cond){for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++)if(this.d[y*this.w+x]===from&&cond(x,y))this.d[y*this.w+x]=to}
  blit(s,ox,oy,flip=false){ox=Math.round(ox);oy=Math.round(oy);for(let y=0;y<s.h;y++)for(let x=0;x<s.w;x++){const c=s.d[y*s.w+(flip?s.w-1-x:x)];if(c>=0)this.set(ox+x,oy+y,c)}}
  outline(c){const o=new Int32Array(this.d);for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){if(this.d[y*this.w+x]>=0)continue;
      if(this.get(x-1,y)>=0||this.get(x+1,y)>=0||this.get(x,y-1)>=0||this.get(x,y+1)>=0)o[y*this.w+x]=c}this.d=o;return this}
}


// =====================================================================
// MUNDO: PUERTO DE KALÉ A ESCALA NUEVA (640x360)
// =====================================================================
const shoreX=y=>Math.round(250+12*Math.sin(y/34)+6*Math.sin(y/11));
const grassX=y=>shoreX(y)+48+Math.round(8*Math.sin(y/18+1));
function tuft(p,x,y){for(const[dx,dy,c]of[[0,0,C.g4],[-1,1,C.g4],[1,1,C.g5],[-2,2,C.g4],[2,2,C.g4],[0,1,C.g2],[-1,2,C.g2],[1,2,C.g2],[-1,3,C.g2],[1,3,C.g2]])p.set(x+dx,y+dy,c)}

const OBJECTS=()=>[
  {scene:'town',x:860,y:596,label:'Mirar',text:'«Aquí echó el ancla el primer barco que llegó a Kalé. Que nadie la levante.» Debajo, alguien ha rayado: «Ya veremos».',learn:['kale','El Ancla de Kalé','La placa dice que nadie debe levantarla. Alguien rayó debajo: «Ya veremos».']},
  {scene:'casa',x:196,y:204,label:'Mirar',text:()=>{const d=S.desap();return d?`La silla de ${d.rel.replace('tu ','')}. Nadie se sienta en ella desde que desapareció.`:'Cuatro taburetes y una mesa marcada por años de cuchillos y redes.'}},
  {scene:'casa',x:300,y:88,label:'Mirar',text:()=>S.fam.secret?'Una caja cerrada con llave, escondida detrás de los frascos. Nunca la habías visto abierta.':'Frascos de conservas, anzuelos y una caja de galletas vacía.',learn:()=>S.fam.secret?['familia','Una caja cerrada','Detrás de los frascos de casa hay una caja con llave que nunca vi abierta.']:null},
  {scene:'brin',x:174,y:72,label:'Mirar',text:'Un mapa viejo y descolorido. Alguien marcó una cruz lejos de cualquier isla conocida.',learn:['rumores','La cruz del mapa de Brin','En casa de Brin hay un mapa con una cruz lejos de cualquier isla conocida.']}
];

// =====================================================================
// DIARIO
// =====================================================================
const DIARY={yo:[],familia:[],gente:[],rumores:[],kale:[]};
function learn(e){if(!e)return;const[sec,title,txt]=e;if(DIARY[sec].some(x=>x.title===title))return;DIARY[sec].push({title,txt});document.getElementById('openDiary').classList.add('new')}
function openDiary(tab='yo'){G.paused=true;document.getElementById('openDiary').classList.remove('new');const ov=document.getElementById('overlays');const old=ov.querySelector('.diary');old&&old.remove();
  const d=document.createElement('div');d.className='diary';const T=[['yo','Yo'],['familia','Familia'],['gente','Gente'],['rumores','Rumores'],['kale','Kalé']];
  const page=k=>{if(k==='yo'){const top=Object.entries(S.of).sort((a,b)=>b[1]-a[1])[0],of=top[1]>0?OFICIOS[top[0]][0]:'Sin oficio fijo';
      return`<div class="entry"><b>${player.name}</b><span>${player.raza}, 17 años. Nací en Kalé, en el East Blue. ${of}.</span></div><div class="entry"><b>Mi sueño</b><span>${S.dream}<br><i>${motive()}</i></span></div>
      <div class="axes">${Object.entries(AX).map(([k,[a,b]])=>{const v=Math.max(-4,Math.min(4,S.ax[k]));return`<div class="ax"><span class="${v<0?'on':''}">${a}</span><span class="tr"><i style="left:${50+v*12}%"></i></span><span class="${v>0?'on':''}">${b}</span></div>`}).join('')}</div>
      <div class="stats">${STATS.map(([k,n])=>`<div>${n}<b>${S.st[k]}</b></div>`).join('')}</div>${S.trs.length||S.items.length?`<div class="entry"><span>${[...S.trs,...S.items].join(' · ')}</span></div>`:''}`}
    return DIARY[k].length?DIARY[k].map(e=>`<div class="entry"><b>${e.title}</b><span>${e.txt}</span></div>`).join(''):'<p class="empty">Todavía no has escrito nada aquí.</p>'};
  d.innerHTML=`<div class="glass book" role="dialog" aria-label="Diario"><div class="tabs">${T.map(([k,n])=>`<button type="button" data-k="${k}" class="${k===tab?'on':''}">${n}</button>`).join('')}<button type="button" class="x" aria-label="Cerrar diario">Cerrar ✕</button></div><div class="page">${page(tab)}</div></div>`;
  ov.appendChild(d);d.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>openDiary(b.dataset.k));d.querySelector('.x').onclick=closeDiary;d.onclick=e=>{if(e.target===d)closeDiary()};d.querySelector('.on').focus()}
function closeDiary(){const d=document.querySelector('.diary');d&&d.remove();G.paused=false}

// =====================================================================
// MOTOR DEL JUEGO
// =====================================================================
const cv=document.getElementById('game'),g=cv.getContext('2d');
const G={scene:'town',x:0,y:0,dir:'down',walk:0,moving:false,paused:true,keys:{},cam:[0,0],VW:480,VH:270,scale:2,minutes:8*60,talking:null,lastT:0,bubbles:[],chat:null};
let TOWN=null;
function fitGame(){const w=innerWidth,h=innerHeight;G.VW=Math.min(640,Math.max(300,Math.round(w/1.6)));G.VH=Math.min(TH,Math.round(G.VW*h/w));G.scale=w/G.VW;cv.width=G.VW;cv.height=G.VH;cv.style.width=w+'px';cv.style.height=G.VH*G.scale+'px';cv.style.left='0';cv.style.top=((h-G.VH*G.scale)/2)+'px';g.imageSmoothingEnabled=false}
addEventListener('resize',()=>{fitBg();if(!cv.hidden)fitGame()});
function blocked(sc,x,y){const s=SCENES[sc];if(s.walk){if(!s.walk(x,y))return true}else{const[a,b,w,h]=s.area;if(x<a||y<b||x>a+w||y>b+h)return true}
  return s.blocks.some(([a,b,w,h])=>x>=a&&x<a+w&&y>=b&&y<b+h)||NPCS.some(n=>n.scene===sc&&Math.abs(n.x-x)<12&&Math.abs(n.y-y)<8)}
function fade(cb){const f=document.getElementById('fadeov');f.style.opacity=1;setTimeout(()=>{cb();f.style.opacity=0},360)}
function enter(to,at,dir){G.scene=to;G.x=at[0];G.y=at[1];G.dir=dir;clearBubbles();const pn=document.getElementById('placeName');pn.textContent=SCENES[to].name;pn.style.opacity=1;clearTimeout(pn._t);pn._t=setTimeout(()=>pn.style.opacity=0,2600)}
function startGame(){menuRunning=false;keyHandler=null;show('');app.classList.add('playing');cv.hidden=false;document.getElementById('hud').hidden=false;fitGame();
  if(!TOWN){TOWN=pbToCanvas(townStatic());buildRooms()}NPCS=[...familySetup(),...TOWN_NPCS()].map(n=>({...n,nextBark:performance.now()+2000+Math.random()*6000,frame:0}));
  if(matchMedia('(pointer:coarse)').matches)document.getElementById('pad').hidden=false;
  enter('casa',[176,100],'down');G.paused=false;
  const first=NPCS.find(n=>n.fam&&n.fam.kind!=='sib');
  setTimeout(()=>{if(first)say(first,{lines:[`¡${player.name}! Por fin te levantas.`,'Ha entrado un barco con bandera negra al puerto. Todo el pueblo está nervioso.','Ve a ver si Brin necesita algo en el muelle. Y no te metas en líos.'],learn:first.talk().learn});else say({name:'',sprite:'grumete'},{lines:['La casa está en silencio. Como siempre desde hace años.']})},700);
  requestAnimationFrame(loop)}
// diálogo
function face(canvas,sprite){const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,64,64);c.drawImage(SHEETS[sprite],0,ROW.down*64,64,40,0,4,64,40)}
function say(npc,conv){G.talking={npc,conv,i:0};if(npc.x!=null&&npc.scene){const dx=G.x-npc.x,dy=G.y-npc.y;npc.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')}renderTalk()}
function renderTalk(){const ov=document.getElementById('overlays');let box=ov.querySelector('.dlg');const t=G.talking;document.getElementById('hud').classList.toggle('talking',!!t);if(!t){box&&box.remove();return}
  if(!box){box=document.createElement('div');box.className='dlg glass';box.setAttribute('role','dialog');ov.appendChild(box)}
  const last=t.i>=t.conv.lines.length-1,ch=last&&t.conv.choices&&!t.chosen;
  box.innerHTML=`<div class="face"><canvas width="64" height="48" aria-hidden="true"></canvas></div><div><b class="nm">${t.npc.name||''}</b><p>${t.conv.lines[t.i]}</p>${ch?`<div class="ch">${t.conv.choices.map((c,i)=>`<button type="button" data-i="${i}">${c[0]}</button>`).join('')}</div>`:''}</div>${ch?'':'<span class="more">E / clic para seguir</span>'}`;
  face(box.querySelector('canvas'),t.npc.sprite);box.onclick=e=>{const b=e.target.closest('button');if(b){const c=t.conv.choices[+b.dataset.i];t.chosen=true;t.conv.lines.push(c[1]);t.i++;renderTalk()}else if(!ch)advance()};
  if(ch)box.querySelector('button').focus()}
function advance(){const t=G.talking;if(!t)return;if(t.i<t.conv.lines.length-1){t.i++;renderTalk()}else{(t.conv.learn||[]).forEach(learn);G.talking=null;renderTalk()}}
// globos de comentarios
function clearBubbles(){G.bubbles.forEach(b=>b.el.remove());G.bubbles=[];G.chat=null}
function bubble(npc,text,ms=3200){const el=document.createElement('div');el.className='bubble';el.textContent=text;document.getElementById('overlays').appendChild(el);const b={npc,el,until:performance.now()+ms};G.bubbles.push(b);return b}
// interacción
function nearest(){let best=null,bd=48;
  for(const n of NPCS)if(n.scene===G.scene&&(n.talk)){const d=Math.hypot(n.x-G.x,n.y-G.y);if(d<bd){bd=d;best={type:'npc',n}}}
  for(const o of OBJECTS())if(o.scene===G.scene){const d=Math.hypot(o.x-G.x,o.y-G.y);if(d<bd){bd=d;best={type:'obj',o}}}
  for(const dr of SCENES[G.scene].doors){const[a,b,w,h]=dr.r;if(G.x>a-8&&G.x<a+w+8&&G.y>b-10&&G.y<b+h+10)return{type:'door',dr}}
  return best}
function interact(){if(G.talking){advance();return}const t=nearest();if(!t)return;
  if(t.type==='npc'){const conv=t.n.talk();say(t.n,{...conv,lines:[...conv.lines],choices:conv.choices})}
  else if(t.type==='obj'){const txt=typeof t.o.text==='function'?t.o.text():t.o.text;const l=typeof t.o.learn==='function'?t.o.learn():t.o.learn;say({name:'',sprite:'grumete'},{lines:[txt],learn:l?[l]:[]})}
  else{fade(()=>enter(t.dr.to,t.dr.at,t.dr.dir))}}
document.addEventListener('keydown',e=>{if(cv.hidden)return;const k=e.key.toLowerCase();
  if(document.querySelector('.diary')){if(k==='escape'||k==='j')closeDiary();return}
  if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){G.keys[k]=true;e.preventDefault()}
  if(k==='e'||k===' '||k==='enter'){if(!e.target.closest||!e.target.closest('button'))interact();e.preventDefault()}
  if(k==='j'&&!G.talking)openDiary()});
document.addEventListener('keyup',e=>{G.keys[e.key.toLowerCase()]=false});
document.getElementById('openDiary').onclick=()=>openDiary();
document.getElementById('actBtn').addEventListener('pointerdown',e=>{e.preventDefault();interact()});
document.querySelectorAll('#pad .pad button').forEach(b=>{const d={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'}[b.dataset.d];
  b.addEventListener('pointerdown',e=>{e.preventDefault();G.keys[d]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>G.keys[d]=false))});
cv.addEventListener('click',()=>{if(G.talking)advance()});
// bucle
function loop(now){const dt=Math.min(50,now-(G.lastT||now))/1000;G.lastT=now;
  if(!G.paused&&!G.talking){
    let vx=0,vy=0;const K=G.keys;if(K.arrowleft||K.a)vx=-1;else if(K.arrowright||K.d)vx=1;if(K.arrowup||K.w)vy=-1;else if(K.arrowdown||K.s)vy=1;
    G.moving=!!(vx||vy);if(G.moving){const sp=(G.scene==='town'?80:90)*dt*(vx&&vy?.7071:1),nx=G.x+vx*sp,ny=G.y+vy*sp;
      if(!blocked(G.scene,nx-6,G.y)&&!blocked(G.scene,nx+6,G.y))G.x=nx;if(!blocked(G.scene,G.x-6,ny)&&!blocked(G.scene,G.x+6,ny))G.y=ny;
      G.dir=vx<0?'left':vx>0?'right':vy<0?'up':'down';G.walk+=dt*10}
    G.minutes+=dt*.8;
    // NPCs: rutas y comentarios
    for(const n of NPCS){if(n.route){n.t=(n.t||Math.random()*100)+dt;const[x,y,d]=where(n.route,n.speed,n.t);n.x=x;n.y=y;n.dir=d;n.frame=1+Math.floor(n.t*9)%8}
      if(n.scene===G.scene&&now>n.nextBark&&!n.chat&&Math.hypot(n.x-G.x,n.y-G.y)<220){bubble(n,pick(n.barks));n.nextBark=now+BARK_GAP[0]+Math.random()*(BARK_GAP[1]-BARK_GAP[0])}}
    // conversación entre vecinas: si te acercas, la escuchas
    const a=NPCS.find(n=>n.id==='vec');if(G.scene==='town'&&a&&!G.chat&&Math.hypot(a.x-G.x,a.y-G.y)<120&&!DIARY.rumores.some(e=>e.title==='Buscan a alguien'))G.chat={i:0,next:now};
    if(G.chat&&now>=G.chat.next){const line=CHATS.vecinas[G.chat.i];if(!line){G.chat=null;learn(['rumores','Buscan a alguien','Las vecinas dicen que los del barco negro buscan a alguien. Y que en Kalé hay «lo de siempre».'])}
      else{bubble(NPCS.find(n=>n.id===line[0]),line[1],2600);G.chat.i++;G.chat.next=now+2700}}
  }
  draw(now);requestAnimationFrame(loop)}
function draw(now){const s=SCENES[G.scene],VW=G.VW,VH=G.VH;
  const cx=Math.max(0,Math.min(s.w-VW,G.x-VW/2)),cy=Math.max(0,Math.min(s.h-VH,G.y-VH/2));const ox=Math.round(s.w<VW?(VW-s.w)/2:-cx),oy=Math.round(s.h<VH?(VH-s.h)/2:-cy);G.cam=[ox,oy];
  g.fillStyle='#120b07';g.fillRect(0,0,VW,VH);
  if(G.scene==='town'){g.drawImage(TOWN,-ox,-oy,VW,VH,0,0,VW,VH);
    const t=now/1000;g.fillStyle='rgba(205,238,246,.85)';for(let i=0;i<70;i++){const x=(i*97+t*14*(1+i%3))%TW,y=(i*233)%TH;if(isSea(x,y)&&!inDock(x,y)&&Math.sin(t*2+i)>.3)g.fillRect(Math.round(x+ox),Math.round(y+oy),3,1)}
    g.fillStyle='rgba(244,255,255,.9)';for(let y=Math.max(0,-oy);y<Math.min(TH,-oy+VH);y+=2){const sx=shoreW(y),o=Math.round(3+2*Math.sin(t*2+y*.15));if(!inDock(sx-o,y))g.fillRect(sx-o+ox,y+oy,2,2)}
  }else{g.drawImage(ROOMS[s.img],ox,oy);const fl=Math.floor(now/110);
    for(const[x,y,w,h,k]of s.fire){if(k==='lamp'){if(hash(fl,x,60)<.35){g.fillStyle='rgba(255,240,170,.55)';g.fillRect(x+ox,y+oy,w,h)}continue}
      for(let i=0;i<w;i+=2){const hh=Math.ceil(h*(.35+.65*hash(i,fl,61)));for(const[c,f]of[['#c8402e',1],['#f5b73a',.6],['#fff0b0',.25]]){const v=Math.ceil(hh*f);g.fillStyle=c;g.fillRect(x+i+ox,y+h-v+oy,2,v)}}}
    g.fillStyle='rgba(255,170,90,.05)';g.fillRect(0,0,VW,VH)}
  const list=NPCS.filter(n=>n.scene===G.scene).map(n=>[n.sprite,n.x,n.y,n.dir,n.route?n.frame:0]);list.push(['grumete',G.x,G.y,G.dir,G.moving?1+Math.floor(G.walk)%8:0]);
  list.sort((a,b)=>a[2]-b[2]);for(const[sp,x,y,d,f]of list){g.fillStyle='rgba(20,10,5,.28)';g.beginPath();g.ellipse(Math.round(x+ox),Math.round(y+oy),11,4,0,0,Math.PI*2);g.fill();drawLPC(g,sp,x+ox,y+oy,d,f)}
  if(G.scene==='town'){g.fillStyle='rgba(255,180,90,.05)';g.fillRect(0,0,VW,VH)}
  // capas de interfaz que siguen al mundo
  const toScr=(x,y)=>[(x+ox)*G.scale,(y+oy)*G.scale+parseFloat(cv.style.top)];
  G.bubbles=G.bubbles.filter(b=>{if(now>b.until||b.npc.scene!==G.scene){b.el.remove();return false}const[x,y]=toScr(b.npc.x,b.npc.y-58);b.el.style.left=x+'px';b.el.style.top=y+'px';return true});
  const ov=document.getElementById('overlays');let pr=ov.querySelector('.prompt');const t=!G.talking&&!G.paused&&nearest();
  if(t){if(!pr){pr=document.createElement('div');pr.className='prompt';ov.appendChild(pr)}const lbl=t.type==='npc'?'Hablar':t.type==='obj'?t.o.label:'Entrar';pr.innerHTML=`<kbd>E</kbd>${t.type==='door'&&G.scene!=='town'?'Salir':lbl}`;
    const[px,py]=t.type==='npc'?[t.n.x,t.n.y-60]:t.type==='obj'?[t.o.x,t.o.y-10]:[t.dr.r[0]+t.dr.r[2]/2,t.dr.r[1]-6];const[sx,sy]=toScr(px,py);pr.style.left=sx+'px';pr.style.top=sy+'px'}else if(pr)pr.remove();
  const m=Math.floor(G.minutes)%1440;document.getElementById('hour').textContent=`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
}
fitBg();
ready.then(menu);
</script>
