<title>One Peak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Outfit:wght@300;400;500;600;700;800&display=swap">
<style>
/* Juego a pantalla completa: el puerto en píxel de fondo, interfaz en vidrio oscuro cálido con oro y rojo. Un solo tema, a propósito. */
:root{--ink:#140c08;--glass:rgba(22,14,10,.62);--glass2:rgba(30,20,14,.78);--edge:rgba(255,214,150,.18);--txt:#fff6e8;--dim:#d9c6a8;--mute:#9c8a70;
  --gold:#f5b73a;--gold2:#ffd98a;--red:#e2492f;--sea:#3d86c6;--f:"Outfit",system-ui,sans-serif;--fd:"Rammetto One","Outfit",sans-serif;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--txt);font-family:var(--f);overflow:hidden}
#app{position:fixed;inset:0;overflow:hidden}
#bg{position:absolute;left:50%;top:50%;image-rendering:pixelated;transform-origin:center;animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-50%,-50%) scale(1.02)}to{transform:translate(-53%,-50%) scale(1.08)}}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,8,5,.9) 0%,rgba(14,8,5,.62) 34%,rgba(14,8,5,.1) 62%,rgba(14,8,5,0) 100%),linear-gradient(0deg,rgba(14,8,5,.7),transparent 30%);transition:background .6s}
@media (max-width:700px){.shade{background:linear-gradient(0deg,rgba(14,8,5,.85),rgba(14,8,5,.35) 70%,rgba(14,8,5,.2))}}
#app.deep .shade{background:linear-gradient(90deg,rgba(14,8,5,.92) 0%,rgba(14,8,5,.78) 46%,rgba(14,8,5,.45) 100%)}
.screen{position:absolute;inset:0;padding:max(28px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;animation:fade .45s ease both;overflow-y:auto}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.col{width:min(620px,100%);margin-left:clamp(0px,6vw,96px);display:flex;flex-direction:column;gap:18px;margin-block:auto}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 18px 50px rgba(0,0,0,.35)}
/* menú */
.logo{font-family:var(--fd);font-size:clamp(54px,10vw,112px);line-height:.92;letter-spacing:.01em;margin:0;color:var(--gold2);
  background:linear-gradient(180deg,#fff2c4 0%,#ffcf5c 45%,#f08a1e 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 0 #3a1608) drop-shadow(0 0 1px #3a1608) drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.logo span{display:block}
.logo span+span{margin-left:.55em}
nav.menu{display:flex;flex-direction:column;gap:2px;margin-top:22px}
.mi{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;font-size:clamp(22px,2.6vw,30px);font-weight:700;color:var(--txt);padding:6px 0;transition:color .15s,transform .15s;width:max-content}
.mi svg{width:24px;height:24px;opacity:0;transform:rotate(-90deg) scale(.6);transition:all .25s}
.mi:hover,.mi:focus-visible,.mi.sel{color:var(--gold2);transform:translateX(8px)}
.mi:hover svg,.mi:focus-visible svg,.mi.sel svg{opacity:1;transform:none}
.mi:disabled{color:var(--mute);cursor:default;transform:none}
.mi:disabled svg{opacity:0}
.ver{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));font-size:13px;color:var(--mute);letter-spacing:.06em}
/* títulos */
.kick{font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
h1.t,h2.t{margin:0;font-weight:800;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
h1.t{font-size:clamp(34px,5vw,54px)}
h2.t{font-size:clamp(26px,3.6vw,38px)}
.lead{margin:0;font-size:19px;line-height:1.5;color:var(--dim);max-width:52ch}
/* botones */
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{all:unset;cursor:pointer;font-weight:700;font-size:17px;padding:13px 26px;border-radius:12px;background:linear-gradient(180deg,#ffcf5c,#f09a28);color:#2a1206;box-shadow:0 4px 0 #9a5410,0 10px 24px rgba(240,154,40,.25);transition:transform .1s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #9a5410}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.ghost{background:transparent;color:var(--txt);border:1.5px solid var(--edge);box-shadow:none}
.btn.ghost:hover{border-color:var(--gold)}
/* creación */
.create{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px;align-items:center;width:min(1060px,100%);margin:auto}
@media (max-width:820px){.create{grid-template-columns:1fr}}
.stage{position:relative;aspect-ratio:1;max-width:380px;width:100%;margin:auto}
.stage::before{content:"";position:absolute;left:12%;right:12%;bottom:8%;height:16%;border-radius:50%;background:radial-gradient(closest-side,rgba(245,183,58,.35),transparent);filter:blur(2px)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.panel{padding:26px 28px;display:flex;flex-direction:column;gap:20px}
label.f{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
input.name{all:unset;font:600 22px var(--f);color:var(--txt);border-bottom:2px solid var(--edge);padding:6px 2px;transition:border-color .2s}
input.name:focus{border-color:var(--gold)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{all:unset;cursor:pointer;font-size:16px;font-weight:600;padding:9px 16px;border-radius:999px;border:1.5px solid var(--edge);color:var(--dim);transition:all .15s}
.seg button:hover{border-color:var(--gold);color:var(--txt)}
.seg button.on{background:var(--gold);border-color:var(--gold);color:#2a1206}
.seg button:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* familia */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.pc{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.pc small{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.pc b{font-size:22px;font-weight:700}
.pc span{color:var(--dim);font-size:15px}
.st{display:inline-block;width:max-content;margin-top:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(95,174,110,.18);color:#a8e6b4}
.st.d{background:rgba(226,73,47,.18);color:#ffb0a0}.st.m{background:rgba(245,183,58,.18);color:var(--gold2)}
.secret{margin:0;font-size:16px;font-style:italic;color:#ffb0a0}
/* preguntas */
.prog{height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .4s}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:center;padding:12px 18px;border-radius:14px;background:var(--glass);border:1px solid var(--edge);font-size:18px;font-weight:500;line-height:1.35;transition:all .15s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.opt kbd{font:700 14px var(--f);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;border:1.5px solid var(--edge);color:var(--dim)}
.opt:hover,.opt:focus-visible{border-color:var(--gold);background:var(--glass2);transform:translateX(6px)}
.opt:hover kbd,.opt:focus-visible kbd{background:var(--gold);border-color:var(--gold);color:#2a1206}
.event{font-size:clamp(22px,3vw,30px);font-weight:300;line-height:1.4;margin:0;max-width:30ch}
/* ficha */
.sheet{width:min(1060px,100%);margin:auto;display:flex;flex-direction:column;gap:16px}
.shead{display:flex;align-items:center;gap:18px}
.shead canvas{width:96px;height:96px;image-rendering:pixelated;flex:none}
.shead b{font-size:clamp(32px,5vw,48px);font-weight:800;line-height:1}
.shead span{color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.ax{display:grid;grid-template-columns:100px 1fr 100px;gap:10px;align-items:center;font-size:14px;color:var(--mute)}
.ax span:last-child{text-align:right}
.ax .on{color:var(--txt);font-weight:600}
.ax .tr{height:6px;border-radius:3px;background:rgba(255,255,255,.12);position:relative}
.ax .tr i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--gold);transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(245,183,58,.25)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;font-weight:600;padding:4px 12px;border-radius:999px;border:1px solid var(--edge);color:var(--dim)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
.stats div{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:3px;font-size:15px;color:var(--dim)}
.stats b{font-size:20px;font-weight:800;color:var(--txt);font-variant-numeric:tabular-nums}
.bond{font-size:15px;line-height:1.45;color:var(--dim)}.bond b{color:var(--txt)}
.dream{font-size:22px;font-weight:600;line-height:1.3;margin:0}
.mot{margin:0;font-size:15px;font-style:italic;color:var(--dim)}
.credits{font-size:14px;line-height:1.6;color:var(--dim);max-height:46vh;overflow:auto;padding-right:6px}
.credits b{color:var(--txt)}
.tog{display:flex;justify-content:space-between;align-items:center;font-size:18px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.sw{all:unset;cursor:pointer;width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.sw[aria-pressed="true"]{background:var(--gold)}.sw[aria-pressed="true"]::after{left:23px}
.sw:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){#bg,.screen{animation:none}.mi,.opt,.btn{transition:none}}
</style>

  <canvas id="bg" width="640" height="360" aria-hidden="true"></canvas>

<script>

// =====================================================================
// MOTOR DE PIXEL ART (mismo de la biblia, escala nueva)
// =====================================================================
const WW=640,WH=360;
const C={out:0x2a1c26,
  g1:0x2c5a3c,g2:0x3e7c40,g3:0x5aa04a,g4:0x8ac85a,g5:0xc6e47e,d1:0x5e3a2a,d2:0x8e6040,d3:0xbc8e5c,d4:0xdcb882,
  s1:0xa8845a,s2:0xd4b07a,s3:0xead09a,s4:0xfaecc4,w0:0x13295a,w1:0x1d4686,w2:0x2a64a8,w3:0x3d86c6,w4:0x74b6e0,w5:0xcdeef6,wf:0xf4ffff,
  k1:0x3a2018,k2:0x6a3a24,k3:0x9a5c34,k4:0xc68a52,k5:0xe6b67e,p1:0x9a8ca0,p2:0xc9c0c8,p3:0xece3da,p4:0xfff8ee,
  r1:0x5a1e26,r2:0x8c2f2e,r3:0xc0503c,r4:0xe27e58,r5:0xf4b07e,t1:0x1c3c48,t2:0x2c6470,t3:0x489896,t4:0x86cabe,
  n1:0x383648,n2:0x5c586e,n3:0x8a8698,n4:0xbcb6c6,b1:0x6a4618,b2:0xb0842e,b3:0xe6c25e,b4:0xfff0b0,
  v1:0x2a1e34,v2:0x3e2e4e,v3:0x56426c,v4:0x725a8a,pink:0xf08aa8,red:0xc8402e,cream:0xefe4cc,cream2:0xddcca8,white:0xfff8ee};
function hash(x,y,s=0){let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,982451653))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
class PB{
  constructor(w,h){this.w=w;this.h=h;this.d=new Int32Array(w*h).fill(-1)}
  set(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h||c==null)return;this.d[y*this.w+x]=c}
  get(x,y){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return -1;return this.d[y*this.w+x]}
  rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,c)}
  ell(cx,cy,rx,ry,c,cond){for(let y=Math.floor(cy-ry-1);y<=cy+ry+1;y++)for(let x=Math.floor(cx-rx-1);x<=cx+rx+1;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1&&(!cond||cond(x,y)))this.set(x,y,c)}}
  poly(pts,c,cond){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const[x,y]of pts){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
    for(let y=Math.floor(y0);y<=y1;y++)for(let x=Math.floor(x0);x<=x1;x++){const px=x+.5,py=y+.5;let ins=false;
      for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)ins=!ins}
      if(ins&&(!cond||cond(x,y)))this.set(x,y,c)}}
  line(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
    for(;;){this.set(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
  thick(x0,y0,x1,y1,w,c){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))*2+1;for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;this.rect(Math.round(x-w/2),Math.round(y-w/2),w,w,c)}}
  recolor(from,to,cond){for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++)if(this.d[y*this.w+x]===from&&cond(x,y))this.d[y*this.w+x]=to}
  blit(s,ox,oy,flip=false){ox=Math.round(ox);oy=Math.round(oy);for(let y=0;y<s.h;y++)for(let x=0;x<s.w;x++){const c=s.d[y*s.w+(flip?s.w-1-x:x)];if(c>=0)this.set(ox+x,oy+y,c)}}
  outline(c){const o=new Int32Array(this.d);for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){if(this.d[y*this.w+x]>=0)continue;
      if(this.get(x-1,y)>=0||this.get(x+1,y)>=0||this.get(x,y-1)>=0||this.get(x,y+1)>=0)o[y*this.w+x]=c}this.d=o;return this}
}


// =====================================================================
// MUNDO: PUERTO DE KALÉ A ESCALA NUEVA (640x360)
// =====================================================================
const shoreX=y=>Math.round(250+12*Math.sin(y/34)+6*Math.sin(y/11));
const grassX=y=>shoreX(y)+48+Math.round(8*Math.sin(y/18+1));
function tuft(p,x,y){for(const[dx,dy,c]of[[0,0,C.g4],[-1,1,C.g4],[1,1,C.g5],[-2,2,C.g4],[2,2,C.g4],[0,1,C.g2],[-1,2,C.g2],[1,2,C.g2],[-1,3,C.g2],[1,3,C.g2]])p.set(x+dx,y+dy,c)}
function crate(p,x,y,w=22,h=20){p.rect(x,y,w,h,C.k4);p.rect(x,y,w,4,C.k5);p.rect(x+2,y+4,w-4,1,C.k3);p.rect(x,y+h-2,w,2,C.k2);p.rect(x,y,2,h,C.k3);p.rect(x+w-2,y,2,h,C.k2);
  p.thick(x+3,y+6,x+w-4,y+h-4,2,C.k3);p.thick(x+w-4,y+6,x+3,y+h-4,2,C.k3);for(const[a,b2]of[[x+2,y+5],[x+w-4,y+5],[x+2,y+h-4],[x+w-4,y+h-4]])p.rect(a,b2,2,2,C.n2);
  p.rect(x-1,y-1,w+2,1,C.k1);p.rect(x-1,y+h,w+2,1,C.k1);p.rect(x-1,y,1,h,C.k1);p.rect(x+w,y,1,h,C.k1)}
function barrel(p,x,y){p.ell(x+9,y+11,9,11,C.k3);p.recolor(C.k3,C.k2,(xx,yy)=>xx>x+12&&yy>y);p.recolor(C.k3,C.k4,(xx,yy)=>xx<x+5&&yy>y);
  for(const yy of[y+5,y+16])for(let xx=x;xx<x+19;xx++)if(p.get(xx,yy)>=0)p.set(xx,yy,xx>x+12?C.n1:C.n2);
  p.ell(x+9,y+3,7,3,C.k4);p.ell(x+9,y+3,5,2,C.k3);p.rect(x+5,y+2,6,1,C.k5);p.ell(x+9,y+11,9.4,11.4,C.k1,(xx,yy)=>p.get(xx,yy)<0)}
function lampPost(p,x,y){p.rect(x,y,3,40,C.n1);p.rect(x+2,y,1,40,0x26243a);p.rect(x-2,y+38,7,3,C.n2);p.rect(x-6,y-6,15,2,C.n1);p.rect(x-4,y-14,11,10,C.b2);p.rect(x-3,y-13,9,8,C.b3);p.rect(x-1,y-11,5,4,C.b4);p.rect(x-5,y-16,13,2,C.n1);p.rect(x,y-18,3,2,C.n1)}
function house(p,o){
  const{x,y,w,rh,wh,roof:R}=o;
  p.rect(x-8,y,w+16,rh,R[2]);
  for(let j=0;j<rh-4;j+=8){p.rect(x-8,y+j+7,w+16,1,R[1]);for(let i=((j/8)%2)*6;i<w+16;i+=12){p.rect(x-8+i,y+j+1,5,2,R[3]);p.set(x-8+i,y+j+3,R[3]);p.rect(x-8+i+10,y+j+2,1,5,R[1]);p.rect(x-8+i+1,y+j+5,8,1,R[1])}}
  p.rect(x-8,y,w+16,4,R[1]);for(let i=0;i<w+16;i+=10){p.rect(x-8+i,y,6,2,R[3]);p.set(x-8+i,y+2,R[0])}
  p.rect(x-10,y,2,rh,R[0]);p.rect(x+w+8,y,2,rh,R[0]);p.rect(x-10,y+rh,w+20,4,R[0]);p.rect(x-8,y+rh-2,w+16,2,R[1]);
  const wy=y+rh+4;p.rect(x,wy,w,wh,C.p3);for(let i=0;i<w*wh/14;i++){p.set(x+hash(i,x,1)*w,wy+hash(i,wy,2)*wh,C.p2)}
  p.rect(x,wy,w,6,C.p1);p.rect(x,wy+6,w,2,C.p2);
  p.rect(x,wy+wh-10,w,10,C.n3);for(let i=0;i<w;i+=10){p.rect(x+i,wy+wh-10,1,5,C.n2);p.rect(x+i+5,wy+wh-5,1,5,C.n2)}p.rect(x,wy+wh-5,w,1,C.n2);p.rect(x,wy+wh-1,w,1,C.n1);p.rect(x,wy+wh-10,w,1,C.n4);

const STILL=[['viejo',202,234,'down'],['capitan',112,236,'right'],['maton',70,126,'down']];
function where(pts,v,t){let L=0;const seg=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length],l=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push([a,b,l]);L+=l}
  let d=(t*v)%L;for(const[a,b,l]of seg){if(d<=l){const f=d/l,dx=b[0]-a[0],dy=b[1]-a[1];return[a[0]+dx*f,a[1]+dy*f,Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')]}d-=l}return[pts[0][0],pts[0][1],'down']}

function bgFrame(ms){const t=ms/1000,step=Math.floor(t*8);

    for(let i=0;i<2;i++)gull(pb,(40+t*22+i*260)%720-40,30+i*44+Math.sin(t+i)*6,t,i);
    render(wimg,pb,'atardecer');bgg.putImageData(wimg,0,0);
    const acts=[...ROUTES.map(([id,pts,v])=>{const[x,y,d]=where(pts,v,t);return[id,x,y,d,1+Math.floor(t*9)%8]}),...STILL.map(([id,x,y,d])=>[id,x,y,d,0])].sort((a,b)=>a[2]-b[2]);
    for(const[id,x,y,d,f]of acts)drawLPC(bgg,id,x,y,d,f);
    bgg.fillStyle='rgba(255,140,60,.08)';bgg.fillRect(0,0,WW,WH)}
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(bgFrame)}

const rnd=Math.random,pick=a=>a[Math.floor(rnd()*a.length)];
const wpick=a=>{const tot=a.reduce((s,x)=>s+x[x.length-1],0);let r=rnd()*tot;for(const x of a){r-=x[x.length-1];if(r<=0)return x}return a[0]};
const cap=s=>s[0].toUpperCase()+s.slice(1);
const S={};
function newFamily(){const used=new Set(),nom=fem=>{let n;do n=pick(fem?NOM_F:NOM_M);while(used.has(n));used.add(n);return n};
  const adult=(rel,fem)=>{const r=rnd(),o=wpick(OCUP);return{rel,nom:nom(fem),oc:fem?o[1]:o[0],vivo:r<.72,desap:r>=.72&&r<.86}};
  const adults=[adult('tu madre',true),adult('tu padre',false)];
  const n=wpick([[0,3],[1,4],[2,3],[3,2],[4,1],[6,.4],[9,.15],[14,.05]])[0];
  const sibs=Array.from({length:n},()=>{const fem=rnd()<.5,o=wpick(OCUP);let e;do e=Math.max(1,Math.round(17+(rnd()-.5)*18));while(e===17);return{nom:nom(fem),fem,edad:e,oc:fem?o[1]:o[0]}});
  const vivos=adults.filter(a=>a.vivo);
  return{adults,sibs,crianza:vivos.length?null:pick(['tu abuela','Doria, una vecina','tu tío, el tabernero']),huerfano:!vivos.length,secret:rnd()<.35}}
function cuidador(){const v=S.fam.adults.filter(a=>a.vivo);return v.length?v[0].rel:S.fam.crianza}
const fill=t=>t.replace('{cuidador}',cuidador()).replace('{Cuidador}',cap(cuidador()));
function reset(){Object.assign(S,{step:0,ax:{coraje:0,corazon:0,orgullo:0,libertad:0,ambicion:0},st:{},of:{},trs:[],tags:[],bonds:[],items:[],start:'listo',dream:null,ev:2+Math.floor(rnd()*6),evDone:false});
  STATS.forEach(([k])=>S.st[k]=8);Object.keys(OFICIOS).forEach(k=>S.of[k]=0);S.fam=newFamily();
  S.tag=t=>S.tags.filter(x=>x===t).length;S.desap=()=>S.fam.adults.find(a=>a.desap)||null}
function apply(fx){if(!fx)return;for(const k in fx.ax||{})S.ax[k]+=fx.ax[k];for(const k in fx.st||{})S.st[k]+=fx.st[k];for(const k in fx.of||{})S.of[k]+=fx.of[k];
  (fx.tr||[]).forEach(t=>{if(!S.trs.includes(t))S.trs.push(t)});(fx.tags||[]).forEach(t=>S.tags.push(t));if(fx.bond)S.bonds.push(fx.bond);if(fx.item)S.items.push(fx.item);if(fx.start)S.start=fx.start}
function motive(){const d=S.desap();if(d)return`Desde que ${d.rel} desapareció, algo te empuja mar adentro.`;
  if(S.fam.huerfano)return'Creciste sin padres. Lo que no tuviste, lo vas a buscar.';
  if(S.tag('justicia')>=2)return'Viste demasiadas veces que la ley y la justicia no son lo mismo.';
  if(S.tag('tesoro'))return'Desde aquella historia para dormir, no has dejado de pensar en lo que hay al final del mar.';
  if(S.bonds.includes('rival'))return'Alguien te dijo que nunca saldrías de esta isla.';
  return'No sabes bien de dónde viene. Pero está ahí, todas las mañanas.'}
function bondText(b){const taken=[...S.fam.adults.map(a=>a.nom),...S.fam.sibs.map(h=>h.nom)],n=()=>pick([...NOM_M,...NOM_F].filter(x=>!taken.includes(x)));
  return{rival:`<b>${n()}</b>, tu rival. Dicen que ahora entrena con la Marina.`,'amigo:protector':`<b>${n()}</b>, tu mejor amigo. Sigue en el puerto.`,'amigo:listo':`<b>${n()}</b>, tu mejor amigo. Se fue hace un año sin despedirse.`,
    'amigo:paria':`<b>${n()}</b>. Nadie quería acercarse a él. Tú sí.`,perdido:`<b>${n()}</b> zarpó aquella noche. Os prometisteis volver a veros.`,maestro:'<b>El forastero</b> que te enseñó a pelear. Tenía una cicatriz en forma de ancla.',
    salvador:'<b>Quien te sacó del agua.</b> Solo recuerdas un brazalete de cuentas rojas.'}[b]||''}

function keys(handler){document.onkeydown=e=>{if(e.target.tagName==='INPUT'&&e.key!=='Enter')return;handler(e)}}

let previewTimer;
function preview(canvas,id){const g=canvas.getContext('2d');g.imageSmoothingEnabled=false;const dirs=['down','left','up','right'];let t0=performance.now();clearInterval(previewTimer);
  previewTimer=setInterval(()=>{const t=(performance.now()-t0)/1000;g.clearRect(0,0,canvas.width,canvas.height);drawLPC(g,id,canvas.width/2,canvas.height*.86,dirs[Math.floor(t/1.6)%4],1+Math.floor(t*9)%8,canvas.width/72)},60)}
function create(){

      <div class="f" style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)">Raza</span>
        <div class="seg" role="radiogroup" aria-label="Raza">${RAZAS.map(r=>`<button type="button" role="radio" aria-checked="${r===player.raza}" class="${r===player.raza?'on':''}">${r}</button>`).join('')}</div></div>

function family(){const f=S.fam,st=a=>a.vivo?'<span class="st">Vive</span>':a.desap?'<span class="st m">Desaparecido</span>':'<span class="st d">Murió</span>';
  const cards=f.adults.map(a=>`<div class="glass pc"><small>${cap(a.rel.replace('tu ',''))}</small><b>${a.nom}</b><span>${cap(a.oc)}</span>${st(a)}</div>`);
  if(f.crianza)cards.push(`<div class="glass pc"><small>Te crió</small><b>${cap(f.crianza)}</b></div>`);
  cards.push(f.sibs.length?`<div class="glass pc"><small>${f.sibs.length===1?'Hermano':'Hermanos'}</small><b>${f.sibs.length>3?f.sibs.length:f.sibs.map(h=>h.nom).join(', ')}</b><span>${f.sibs.length>3?'En casa nunca hubo silencio.':f.sibs.map(h=>h.edad+' años').join(' · ')}</span></div>`:`<div class="glass pc"><small>Hermanos</small><b>Ninguno</b></div>`);
  show(`<div class="col" style="width:min(880px,100%)"><div class="kick">Kalé · East Blue</div><h1 class="t">${player.name}, ${player.raza==='Humano'?'naciste aquí':'naciste '+({Gyojin:'gyojin','Mink':'mink','Brazos largos':'de la tribu de brazos largos','Piernas largas':'de la tribu de piernas largas'})[player.raza]+' en una isla de humanos'}.</h1>
    <div class="cards">${cards.join('')}</div>${f.secret?'<p class="secret">Hay algo de tu familia que nadie te ha contado.</p>':''}

  document.getElementById('go').onclick=question;keys(()=>{});

function question(){
  if(S.step>=Q.length)return dream();
  if(!S.evDone&&S.step===S.ev){S.evDone=true;const opts=EVENTS.filter(e=>e.when(S));if(opts.length){const e=pick(opts),txt=e.t(S);apply(e.fx);
    show(`<div class="col"><div class="prog"><i style="width:${S.step/Q.length*100}%"></i></div><p class="event">${txt}</p><div class="row"><button class="btn" type="button" id="go">Continuar</button></div></div>`);
    document.getElementById('go').onclick=question;return}}
  const q=Q[S.step];
  show(`<div class="col"><div class="prog"><i style="width:${S.step/Q.length*100}%"></i></div><div class="kick">${q.age}</div><h2 class="t">${fill(q.q)}</h2>
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><kbd>${i+1}</kbd><span>${fill(o.t)}</span></button>`).join('')}</div></div>`);
  const btns=[...root.querySelectorAll('.opt')];btns.forEach(b=>b.onclick=()=>{apply(q.o[+b.dataset.i]);S.step++;question()});
  keys(e=>{const n=+e.key;if(n>=1&&n<=btns.length)btns[n-1].click();const i=btns.indexOf(document.activeElement);if(e.key==='ArrowDown'){btns[(i+1)%btns.length].focus();e.preventDefault()}if(e.key==='ArrowUp'){btns[(i-1+btns.length)%btns.length].focus();e.preventDefault()}});
}
function dream(){const d=S.desap(),list=DREAMS.map(x=>({t:x.t.replace('{desaparecido}',d?d.rel:''),s:x.sc(S)})).filter(x=>x.s>-50).sort((a,b)=>b.s-a.s).slice(0,3);
  show(`<div class="col"><div class="prog"><i style="width:100%"></i></div><div class="kick">17 años</div><h2 class="t">¿Qué sueño te llevas al mar?</h2><p class="lead">${motive()}</p>
    <div class="opts">${list.map((x,i)=>`<button class="opt" type="button" data-i="${i}"><kbd>${i+1}</kbd><span>${x.t}</span></button>`).join('')}</div></div>`);
  const btns=[...root.querySelectorAll('.opt')];btns.forEach(b=>b.onclick=()=>{S.dream=list[+b.dataset.i].t;sheet()});
  keys(e=>{const n=+e.key;if(n>=1&&n<=btns.length)btns[n-1].click()});

function sheet(){

      <div class="glass card"><h3>Oficio</h3><p class="dream" style="font-size:19px">${of[0]}</p><div class="chips"><span class="chip">A bordo: ${of[1]}</span>${S.trs.map(t=>`<span class="chip">${t}</span>`).join('')}${S.items.map(t=>`<span class="chip">${t}</span>`).join('')}</div></div>
      <div class="glass card"><h3>Estadísticas</h3><div class="stats">${STATS.map(([k,n])=>`<div>${n}<b>${S.st[k]}</b></div>`).join('')}</div></div>
      <div class="glass card"><h3>Vínculos</h3>${bonds.length?bonds.map(b=>`<div class="bond">${b}</div>`).join(''):'<div class="bond">Nadie te ata a esta isla.</div>'}</div>
      <div class="glass card"><h3>Punto de partida</h3><p class="dream" style="font-size:19px">${S.start==='zarpado'?'Ya has zarpado':'Listo para zarpar'}</p></div>
